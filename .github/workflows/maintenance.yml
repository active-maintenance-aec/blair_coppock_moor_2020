# Active maintenance check: reruns run_all.R on current R and CRAN packages every
# 8 weeks, in this repository's own slot. The shared logic, and the schedule for
# every repository, live in active-maintenance-aec/maintenance.
name: maintenance

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    uses: active-maintenance-aec/maintenance/.github/workflows/check.yml@main
    with:
      phase: 6
      monte_carlo: "maintained/output/figure_4_meta_estimates.csv maintained/output/table_4_meta_summary_cat.csv ground_truth/blair_coppock_moor_2020_ground_truth.csv=0:2.6"
      monte_carlo_rtol: "0"
      monte_carlo_atol: "0.026"
